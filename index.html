<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wildfire Flux Explorer</title>
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <header>
    <h1>Wildfire Flux Explorer</h1>
    <select id="site"></select>
    <span id="badge" class="badge">EXAMPLE DATA</span>
  </header>
  <div id="timeline"></div>
  <div id="vars"></div>
  <canvas id="chart" width="300" height="140"></canvas>
  <p id="note"></p>
</div>
<div id="cam">
  <video id="video" playsinline muted></video>
  <button id="camBtn">Enable hand tracking</button>
  <p id="gesture">Mouse: drag = orbit, wheel = zoom, ←/→ = phase, space = pause, 1–6 = variable</p>
  <small>Camera frames are processed locally in your browser; nothing is uploaded.</small>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
