<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildfire Flux Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #111; color: #eee; }
    #video { position: absolute; top: 10px; left: 10px; width: 200px; border: 2px solid #444; }
    #info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; max-width: 400px; }
    #phase { font-size: 1.2em; color: #ff6b35; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <div id="info">
    <h2>Wildfire Flux Explorer</h2>
    <div id="phase">Phase: Pre-fire</div>
    <p>Gestures: Open hand to cycle phases (Pre/During/Post), Point to inspect, Pinch to zoom.</p>
    <p>Sites: Similipal (2021 fire), Bandhavgarh, Chamba. Placeholder data from research papers.</p>
    <p>Hand tracking runs locally. Video never leaves your device.</p>
  </div>
  <script>
    // Basic Three.js scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Simple terrain/forest placeholder
    const geometry = new THREE.PlaneGeometry(20, 20, 32, 32);
    const material = new THREE.MeshBasicMaterial({ color: 0x228B22, wireframe: true });
    const terrain = new THREE.Mesh(geometry, material);
    terrain.rotation.x = -Math.PI / 2;
    scene.add(terrain);

    // Placeholder particles (fire/smoke)
    const particles = new THREE.Group();
    for (let i = 0; i < 200; i++) {
      const pGeom = new THREE.SphereGeometry(0.05, 4, 4);
      const pMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff4500 : 0x888888 });
      const p = new THREE.Mesh(pGeom, pMat);
      p.position.set((Math.random()-0.5)*10, Math.random()*3, (Math.random()-0.5)*10);
      particles.add(p);
    }
    scene.add(particles);

    camera.position.z = 15;
    camera.position.y = 5;

    // MediaPipe Hands setup (basic)
    const videoElement = document.getElementById('video');
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    let phase = 0;
    const phases = ['Pre-fire', 'During-fire', 'Post-fire'];
    const colors = [0x228B22, 0xff4500, 0x8B4513];

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        // Simple gesture: check if hand is open (distance between wrist and middle tip)
        const wrist = landmarks[0];
        const middleTip = landmarks[12];
        const dist = Math.hypot(wrist.x - middleTip.x, wrist.y - middleTip.y);
        if (dist > 0.3) {
          // Open hand - cycle phase occasionally
          if (Math.random() < 0.02) {
            phase = (phase + 1) % 3;
            document.getElementById('phase').textContent = 'Phase: ' + phases[phase];
            terrain.material.color.setHex(colors[phase]);
          }
        }
        // Rotate based on hand position
        terrain.rotation.z = (landmarks[9].x - 0.5) * Math.PI;
      }
    });

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    cameraUtils.start();

    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
